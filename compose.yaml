services:
  blog:
    build: .
    container_name: bg3-blog
    ports:
      - "4321:4321"
    volumes:
      - ./:/app                          # edita no seu PC, a página atualiza na hora
      - node_modules:/app/node_modules   # dependências do container (Linux), instaladas sozinhas
    restart: unless-stopped

volumes:
  node_modules:
